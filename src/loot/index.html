<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wizard.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loot the Bodies</title>
    <script type="module" src="../js/loot.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header id="main-header"></header>
    <main>
      <p>
           You have defeated the enemy, now loot the bodies!
          </p>  
 <!--encounter form-->
  <section class="lootInformation">
          <form
            id="lootForm"
            onsubmit=" event.preventDefault(); /* const myCheckout = new CheckoutProcess(); myCheckout.init(); myCheckout.checkout(this);*/"
            novalidate
          >
            <h2>Encounter Details</h2>
            <!-- Hidden inline notification alert area -->
            <div
              id="validation-alert"
              class="encounter-hidden-alert"
              role="alert"
            >
              Please correct the highlighted fields before continuing.
            </div>
            <label for="partyLevel"
              >Party Level <span class="required-asterisk"></span
            ></label>
            <input type="number" id="partyLevel" name="partyLevel" required />
<br>
            <label for="enemyParty"
              >Number of Enemies <span class="required-asterisk"></span
            ></label>
            <input type="number" id="enemyParty" name="enemyParty" required />
            <br>
            <label for="difficulty"
              >Difficulty Level <span class="required-asterisk"></span
            ></label>
            <select id="difficulty" name="difficulty" required>
              <option value="">Select Difficulty</option>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
              <option value="deadly">Deadly</option>
            </select>
            <br>
            <button type="submit" id="generateLoot">
              Generate Loot
            </button>
          </form>
<!--generated results-->
    <section id="lootContainer"></section>
    </main>
    <footer class="divider" id="main-footer"></footer>
</html>
